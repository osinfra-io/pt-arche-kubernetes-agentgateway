apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentgateway-authentik
  namespace: istio-ingress
spec:
  action: CUSTOM
  provider:
    name: authentik
  rules:
    - to:
        - operation:
            hosts:
              - agentgateway.localhost
            notPaths:
              - /agentgateway-test/health
              - /agentgateway-test/metadata/*
              - /outpost.goauthentik.io/*
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
