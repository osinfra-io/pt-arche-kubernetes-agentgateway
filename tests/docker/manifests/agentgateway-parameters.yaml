apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  deployment:
    spec:
      replicas: 1
      template:
        metadata:
          labels:
            app: agentgateway
  logging:
    format: json
  rawConfig:
    config:
      adminAddr: 0.0.0.0:15000
  service:
    spec:
      type: ClusterIP
