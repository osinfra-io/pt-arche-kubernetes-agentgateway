apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-admin
  namespace: agentgateway-system
spec:
  hostnames:
    - agentgateway.localhost
  parentRefs:
    - name: gateway
      namespace: istio-ingress
  rules:
    - filters:
        - requestRedirect:
            path:
              replaceFullPath: /ui/
              type: ReplaceFullPath
            statusCode: 302
          type: RequestRedirect
      matches:
        - path:
            type: Exact
            value: /
    - backendRefs:
        - name: agentgateway-proxy-admin
          port: 15000
      matches:
        - path:
            type: PathPrefix
            value: /ui
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: Exact
            value: /config_dump
